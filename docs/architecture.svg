<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1040" viewBox="0 0 1640 1040" role="img" aria-labelledby="title description">
<title id="title">OpenBound ownership and evidence boundaries</title>
<desc id="description">One agent owns the task. Private sources are adapted into an isolated public candidate. Inspector and verification produce private evidence. Only the candidate crosses the host-authorized external delivery boundary.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#465369" stroke-width="1.4"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="55" y="57" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#1d2b3d">
<tspan x="55" dy="0">OpenBound — one owner, explicit boundaries</tspan>
</text>
<text x="57" y="87" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#526275">
<tspan x="57" dy="0">Current engineering package: selective methods, isolated candidates, reusable evidence, host-owned delivery</tspan>
</text>
<rect x="40" y="110" width="1560" height="210" rx="16" fill="#eef3ff" stroke="#d9e0e8"/>
<text x="62" y="137" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#465369">
<tspan x="62" dy="0">ONE TASK · DECISIONS STAY WITH THE AGENT</tspan>
</text>
<rect x="40" y="350" width="1560" height="420" rx="16" fill="#f3f6f7" stroke="#d9e0e8"/>
<text x="62" y="377" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#465369">
<tspan x="62" dy="0">LOCAL WORK · PRIVATE CONTROL MATERIAL STAYS OUTSIDE THE PUBLIC CANDIDATE</tspan>
</text>
<rect x="40" y="800" width="1560" height="200" rx="16" fill="#fff6e8" stroke="#d9e0e8"/>
<text x="62" y="827" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#465369">
<tspan x="62" dy="0">EXTERNAL DELIVERY · SEPARATE USER AUTHORITY AND OBSERVATION</tspan>
</text>
<polyline points="350,212 420,212" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="368" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="368" dy="0">goal</tspan>
</text>
<polyline points="750,195 850,195" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="769" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="769" dy="0">trigger</tspan>
</text>
<polyline points="850,248 750,248" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="770" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="770" dy="0">return</tspan>
</text>
<polyline points="585,285 585,305 1395,305 1395,285" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="815" y="314" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="815" dy="0">one continuing commission</tspan>
</text>
<polyline points="330,485 400,485" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="342" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="342" dy="0">select</tspan>
</text>
<polyline points="720,485 810,485" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="738" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="738" dy="0">create</tspan>
</text>
<polyline points="860,540 860,575 565,575 565,610" fill="none" stroke="#465369" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
<text x="596" y="581" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="596" dy="0">selected surfaces</tspan>
</text>
<polyline points="965,540 965,610" fill="none" stroke="#465369" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
<text x="980" y="601" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="980" dy="0">checks</tspan>
</text>
<polyline points="720,665 752,665 752,746 1380,746 1380,685" fill="none" stroke="#465369" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
<text x="853" y="755" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="853" dy="0">coverage + rule identity</tspan>
</text>
<polyline points="1110,665 1160,665 1160,615 1220,615" fill="none" stroke="#465369" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
<text x="1147" y="613" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="1147" dy="0">results</tspan>
</text>
<polyline points="1540,610 1580,610 1580,140 1395,140 1395,155" fill="none" stroke="#465369" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#arrow)"/>
<polyline points="1100,485 1130,485 1130,790 515,790 515,855" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="724" y="798" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="724" dy="0">candidate payload only</tspan>
</text>
<polyline points="680,908 900,908" fill="none" stroke="#465369" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="715" y="902" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#465369">
<tspan x="715" dy="0">when authorized</tspan>
</text>
<rect x="70" y="165" width="280" height="115" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="88" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="88" dy="0">User commission</tspan>
</text>
<text x="88" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="88" dy="0">Public object + public promises</tspan>
<tspan x="88" dy="22.4">Existing authorization</tspan>
</text>
<rect x="420" y="155" width="330" height="130" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="438" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="438" dy="0">OpenBound Agent</tspan>
</text>
<text x="438" y="221" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="438" dy="0">Owns the complete outcome</tspan>
<tspan x="438" dy="22.4">Mature projects stay direct</tspan>
</text>
<rect x="850" y="155" width="330" height="130" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="868" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="868" dy="0">Seven flat references</tspan>
</text>
<text x="868" y="221" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="868" dy="0">Load for an observed obstacle</tspan>
<tspan x="868" dy="22.4">Return to the same task</tspan>
</text>
<rect x="1250" y="155" width="290" height="130" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="1268" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="1268" dy="0">Task context</tspan>
</text>
<text x="1268" y="221" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="1268" dy="0">Decisions + current evidence</tspan>
<tspan x="1268" dy="22.4">Persist only when useful</tspan>
</text>
<rect x="70" y="430" width="260" height="110" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="88" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="88" dy="0">Private originals</tspan>
</text>
<text x="88" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="88" dy="0">Code, notes, experiments</tspan>
<tspan x="88" dy="22.4">Remain unchanged</tspan>
</text>
<rect x="400" y="430" width="320" height="110" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="418" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="418" dy="0">Agent + projector</tspan>
</text>
<text x="418" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="418" dy="0">Select, adapt, author</tspan>
<tspan x="418" dy="22.4">Explicit plan; new output</tspan>
</text>
<rect x="810" y="430" width="290" height="110" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="828" y="465" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="828" dy="0">Public candidate</tspan>
</text>
<text x="828" y="496" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="828" dy="0">Actual files + exact identity</tspan>
<tspan x="828" dy="22.4">Reviewable local result</tspan>
</text>
<rect x="410" y="610" width="310" height="110" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="428" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="428" dy="0">Inherited inspector</tspan>
</text>
<text x="428" y="676" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="428" dy="0">Selected trees + metadata</tspan>
<tspan x="428" dy="22.4">Observed and missing scope</tspan>
</text>
<rect x="800" y="610" width="310" height="110" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="818" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="818" dy="0">Verification runner</tspan>
</text>
<text x="818" y="676" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="818" dy="0">Fresh copy per reviewed check</tspan>
<tspan x="818" dy="22.4">Witnesses; no OS sandbox</tspan>
</text>
<rect x="1220" y="550" width="320" height="135" rx="9" fill="#ffffff" stroke="#8393aa" stroke-width="1.5"/>
<text x="1238" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="1238" dy="0">Private evidence</tspan>
</text>
<text x="1238" y="616" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="1238" dy="0">Content, rules, execution IDs</tspan>
<tspan x="1238" dy="22.4">Reuse only while bindings hold</tspan>
<tspan x="1238" dy="22.4">Never a safety certificate</tspan>
</text>
<rect x="350" y="855" width="330" height="105" rx="9" fill="#fffdf8" stroke="#8393aa" stroke-width="1.5"/>
<text x="368" y="890" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="368" dy="0">Host-authorized action</tspan>
</text>
<text x="368" y="921" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="368" dy="0">Commit / push / visibility</tspan>
<tspan x="368" dy="22.4">Release / package / deploy</tspan>
</text>
<rect x="900" y="855" width="450" height="105" rx="9" fill="#fffdf8" stroke="#8393aa" stroke-width="1.5"/>
<text x="918" y="890" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#1d2b3d">
<tspan x="918" dy="0">Observed external state</tspan>
</text>
<text x="918" y="921" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#415268">
<tspan x="918" dy="0">Exact refs, assets, runtime or visibility</tspan>
<tspan x="918" dy="22.4">Report only the state actually reached</tspan>
</text>
</svg>
